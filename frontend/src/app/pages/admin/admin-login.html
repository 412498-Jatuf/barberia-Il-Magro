<form class="ingreso" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
  <p class="etiqueta">Acceso privado</p>
  <h1>Panel de Il Magro</h1>
  <p class="sub">Ingresá para ver los turnos, cambiar tu horario y cerrar días.</p>

  <label class="campo">
    <span>Usuario</span>
    <input formControlName="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" />
  </label>

  <label class="campo">
    <span>Clave</span>
    <span class="con-boton">
      <input formControlName="clave" [type]="verClave() ? 'text' : 'password'" autocomplete="current-password" />
      <button type="button" class="accion" (click)="verClave.set(!verClave())"
              [attr.aria-pressed]="verClave()">{{ verClave() ? 'Ocultar' : 'Mostrar' }}</button>
    </span>
  </label>

  @if (error(); as e) {
    <p class="estado error" role="alert">{{ e }}</p>
  }

  <button type="submit" class="btn btn--primary" [disabled]="enviando()">
    {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
  </button>
</form>
