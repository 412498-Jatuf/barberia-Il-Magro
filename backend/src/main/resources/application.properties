spring.application.name=barberia

# Datos privados (contraseña de la base, claves de avisos) en backend/.env, un archivo que queda en
# tu compu y NUNCA se sube al repo (.gitignore). Ver backend/.env.ejemplo. Las variables de entorno
# del sistema, si existen, tienen prioridad sobre el archivo.
spring.config.import=optional:file:.env[.properties]

# --- Base de datos: PostgreSQL ---
# La contraseña NO tiene valor por defecto: en produccion va por la variable de entorno DB_PASSWORD
# (si falta, la app no arranca). Para desarrollo local: SPRING_PROFILES_ACTIVE=dev (application-dev.properties).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ilmagro}
spring.datasource.username=${DB_USER:ilmagro}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Reglas de reserva (el horario semanal y los dias cerrados los edita Luca desde el panel) ---
barberia.horario.intervalo-minutos=30
barberia.horario.dias-anticipacion=7
barberia.horario.zona=America/Argentina/Buenos_Aires

# Avisos a la barberia cuando se confirma un turno (infrastructure/avisos). Cada canal se activa
# solo si tiene sus datos; sin ninguno, los turnos quedan solo en la base y se avisa en el log.
# WhatsApp via CallMeBot: la apikey se pide una vez desde el WhatsApp de la barberia.
barberia.avisos.whatsapp.telefono=${AVISO_WHATSAPP_TELEFONO:+5493516598837}
barberia.avisos.whatsapp.apikey=${AVISO_WHATSAPP_APIKEY:}
# Email: destinatario y servidor SMTP (Brevo: smtp-relay.brevo.com, 587, usuario y clave SMTP de Brevo;
# MAIL_FROM es el remitente verificado en Brevo. Con Gmail: smtp.gmail.com y una contraseña de aplicacion)
# Direccion publica del sitio, para el link de cancelacion en el aviso
barberia.avisos.sitio=${SITIO_URL:http://localhost:4200}
barberia.avisos.email.para=${AVISO_EMAIL_PARA:}
barberia.avisos.email.de=${MAIL_FROM:${MAIL_USER:}}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sin estos limites un servidor de mail inalcanzable (puerto bloqueado por el hosting) deja la conexion
# colgada hasta que el sistema se rinde; asi falla rapido y queda en el log
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- Seguridad ---
# Freno contra el spam (LimiteDePedidosFilter): pedidos por IP por hora
barberia.seguridad.reservas-por-hora=${LIMITE_RESERVAS_POR_HORA:5}
barberia.seguridad.cancelaciones-por-hora=${LIMITE_CANCELACIONES_POR_HORA:30}
barberia.seguridad.logins-por-hora=${LIMITE_LOGINS_POR_HORA:10}
# Detras de un proxy con HTTPS (Nginx, Cloudflare, Render...) poner FORWARD_HEADERS=native: Tomcat toma la
# IP real del cliente (para el limite de pedidos) y el https de X-Forwarded-*, y solo confia en proxies de
# red interna. Sin proxy dejarlo en none: si no, se puede falsear la IP.
server.forward-headers-strategy=${FORWARD_HEADERS:none}

# La plataforma de hosting da el puerto en PORT (Render); en local, 8080
server.port=${PORT:8080}

# Pocas conexiones a la base: el plan gratis de Supabase tiene un tope bajo y este sitio casi no tiene concurrencia
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
spring.datasource.hikari.minimum-idle=1
# Los errores nunca muestran detalles internos al cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
# Cookies de sesion (por si algun dia se usan): solo por HTTPS y sin acceso desde JavaScript
server.servlet.session.cookie.http-only=true
# COOKIE_SECURE=false solo para probar por http desde el celular en la red local; en produccion va con https
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=strict

# --- Panel de administracion (/admin): quienes entran. Las claves van en backend/.env, nunca aca ---
barberia.admin.usuario1=${ADMIN_USUARIO_1:}
barberia.admin.clave1=${ADMIN_CLAVE_1:}
barberia.admin.usuario2=${ADMIN_USUARIO_2:}
barberia.admin.clave2=${ADMIN_CLAVE_2:}
