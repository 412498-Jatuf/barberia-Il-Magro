# Tests: H2 en memoria en modo PostgreSQL. Flyway corre las mismas migraciones que en produccion.
spring.datasource.url=jdbc:h2:mem:ilmagro-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Los tests nunca mandan avisos reales: aunque exista backend/.env con el mail o el WhatsApp de verdad
barberia.avisos.email.para=
barberia.avisos.whatsapp.apikey=
spring.mail.host=

# Usuarios del panel solo para los tests (no son claves reales)
barberia.admin.usuario1=luca-test
barberia.admin.clave1=clave-de-prueba-123
barberia.admin.usuario2=
barberia.admin.clave2=

# Los tests de HTTP real van por http (sin https), asi que la cookie de sesion no puede ser "secure"
server.servlet.session.cookie.secure=false
